[package]
name = "eox-oracle"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "eox_oracle"
[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
eox-oracle-math = { path = "../../crates/math" }

[dev-dependencies]
litesvm = "=0.6.1"
solana-sdk = "=2.2.1"
bincode = "1.3.3"
