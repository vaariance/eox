[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[lint]
# Public immutables are part of the ABI (oracle(), wormhole(), bondCurrency(), identifier())
# that the SDK calls; renaming them to SCREAMING_SNAKE_CASE would rename those getters.
exclude_lints = ["screaming-snake-case-immutable"]

[fmt]
line_length = 100
