[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../../oracle/fixtures" }]

[lint]
exclude_lints = ["screaming-snake-case-immutable"]

[fmt]
line_length = 100
