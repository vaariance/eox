[package]
name = "eox-oracle"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
eox-engine = { path = "../methodology" }
eox_settlement_oracle = { path = "../onchain/programs/eox_settlement_oracle", features = ["no-entrypoint"] }
anchor-lang = "1.2.0"
solana-rpc-client = { version = "3.1", default-features = false }
solana-commitment-config = "3"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "3"
anchor-spl = "1.2.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-account = "3"
