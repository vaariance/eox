[package]
name = "eox-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
thiserror = "1.0"

[dev-dependencies]
chrono = { version = "0.4", features = ["clock"] }
hex = "0.4"
